# ==============================================================================
# Render Blueprint Specification for IoT Fire Detection System
# Multi-Service Architecture:
# 1. Managed PostgreSQL Database
# 2. Containerized FastAPI Web Service (Docker)
# 3. Static Site React Frontend (Vite)
# ==============================================================================

databases:
  - name: fire-detection-postgres
    plan: free
    databaseName: fire_detection_db
    user: fire_admin
    region: oregon # or frankfurt, singapore

services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (FastAPI + Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: iot-fire-detection-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fire-detection-postgres
          property: connectionString
      - key: DEVICE_API_KEY
        generateValue: true # Generates a secure random API key on Render
      - key: ALLOWED_ORIGINS
        value: "*" # Set to your deployed frontend URL after deployment
      - key: DEVICE_OFFLINE_THRESHOLD_SECONDS
        value: "30"

  # ----------------------------------------------------------------------------
  # Frontend Static Site (React + Vite)
  # ----------------------------------------------------------------------------
  - type: web
    name: iot-fire-detection-dashboard
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: iot-fire-detection-backend
          property: host
          # Render automatically prepends https:// when resolving host for static sites
      - key: VITE_POLL_INTERVAL_MS
        value: "3000"
